name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_RESOURCE_GROUP: 'rg-order-processing'
  REGISTRY_NAME: 'orderscruzlpsmouiyo6a'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build OrderApi
        run: dotnet build src/OrderApi/OrderApi.csproj --configuration Release

      - name: Build FraudChecker
        run: dotnet build src/FraudChecker/FraudChecker.csproj --configuration Release

      - name: Build OrderWorker
        run: dotnet build src/OrderWorker/OrderWorker.csproj --configuration Release

  deploy-functions:
    name: Deploy Azure Functions
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Publish OrderApi
        run: dotnet publish src/OrderApi/OrderApi.csproj -c Release -o ./publish/OrderApi

      - name: Deploy OrderApi
        uses: Azure/functions-action@v1
        with:
          app-name: orders-dev-api-q7x2
          package: ./publish/OrderApi

      - name: Publish FraudChecker
        run: dotnet publish src/FraudChecker/FraudChecker.csproj -c Release -o ./publish/FraudChecker

      - name: Deploy FraudChecker
        uses: Azure/functions-action@v1
        with:
          app-name: orders-dev-fraud
          package: ./publish/FraudChecker

  build-push-container:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Container Registry
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY_NAME }}.azurecr.io/order-worker:${{ github.sha }} -t ${{ env.REGISTRY_NAME }}.azurecr.io/order-worker:latest -f src/OrderWorker/Dockerfile src/OrderWorker
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/order-worker:${{ github.sha }}
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/order-worker:latest

      - name: Update Container App
        run: |
          az containerapp update \
            --name orders-dev-worker \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY_NAME }}.azurecr.io/order-worker:${{ github.sha }}